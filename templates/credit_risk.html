<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Risk Assessment</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f4f6fb;
            --surface: #ffffff;
            --surface2: #f8f9fc;
            --border: #e2e6f0;
            --accent: #2563eb;
            --accent-light: #eff4ff;
            --text: #1a2035;
            --muted: #6b7280;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 70% 50% at 80% 0%, rgba(37,99,235,0.06) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 0% 100%, rgba(37,99,235,0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px 60px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeUp 0.6s ease both;
        }

        .header-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px; height: 52px;
            background: var(--accent-light);
            border-radius: 14px;
            font-size: 24px;
            margin-bottom: 16px;
        }

        h1 {
            font-family: 'DM Serif Display', serif;
            font-size: clamp(28px, 4vw, 44px);
            line-height: 1.1;
            color: var(--text);
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }

        h1 em {
            font-style: italic;
            color: var(--accent);
        }

        .subtitle {
            font-size: 15px;
            color: var(--muted);
            max-width: 400px;
            line-height: 1.6;
            margin: 0 auto;
        }

        .card {
            width: 100%;
            max-width: 680px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.04), 0 20px 40px rgba(0,0,0,0.06);
            animation: fadeUp 0.7s 0.1s ease both;
        }

        .card-header {
            padding: 20px 32px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface2);
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .step-indicator {
            display: flex;
            gap: 6px;
        }

        .step-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--border);
        }
        .step-dot.active { background: var(--accent); }

        form { padding: 32px; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            color: var(--muted);
        }

        .input-wrap { position: relative; }

        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            pointer-events: none;
            opacity: 0.55;
        }

        input, select {
            width: 100%;
            padding: 10px 12px 10px 34px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            appearance: none;
            -webkit-appearance: none;
        }

        input:focus, select:focus {
            outline: none;
            background: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }

        input::placeholder { color: #b0b7c3; }

        .select-wrap { position: relative; }
        .select-wrap::after {
            content: '▾';
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
            font-size: 12px;
        }
        .select-wrap select { padding-right: 28px; }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--accent);
            padding: 8px 0 2px;
            border-top: 1px solid var(--border);
            grid-column: 1 / -1;
        }

        .submit-row {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        button[type="submit"] {
            flex: 1;
            padding: 13px;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 14px rgba(37,99,235,0.3);
        }

        button[type="submit"]:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(37,99,235,0.35);
        }

        button[type="submit"]:active { transform: translateY(0); }

        .btn-reset {
            padding: 13px 20px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--muted);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s;
        }

        .btn-reset:hover { color: var(--text); border-color: #c0c7d6; }

        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: var(--muted);
            text-align: center;
            animation: fadeUp 0.8s 0.2s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 560px) {
            .form-grid { grid-template-columns: 1fr; }
            form { padding: 24px 20px; }
            .page { padding: 40px 16px 40px; }
        }
    </style>
</head>
<body>

    <div class="page">
        <div class="page-header">
            <div class="header-icon">📊</div>
            <h1>Credit Risk<br><em>Assessment</em></h1>
            <p class="subtitle">Enter applicant details below to receive an instant risk evaluation.</p>
        </div>

        <div class="card">
            <div class="card-header">
                <span class="card-title">Application Form</span>
                <div class="step-indicator">
                    <div class="step-dot active"></div>
                    <div class="step-dot active"></div>
                    <div class="step-dot"></div>
                </div>
            </div>

            <form action="/predict" method="post">
                <div class="form-grid">

                    <div class="section-label">Personal Information</div>

                    <div class="form-group">
                        <label>Age</label>
                        <div class="input-wrap">
                            <span class="input-icon">👤</span>
                            <input type="number" name="person_age" placeholder="e.g. 35" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Annual Income</label>
                        <div class="input-wrap">
                            <span class="input-icon">$</span>
                            <input type="number" name="person_income" placeholder="e.g. 60000" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Employment Length (yrs)</label>
                        <div class="input-wrap">
                            <span class="input-icon">💼</span>
                            <input type="number" name="person_emp_length" placeholder="e.g. 5" step="0.1" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Home Ownership</label>
                        <div class="input-wrap select-wrap">
                            <span class="input-icon">🏠</span>
                            <select name="person_home_ownership">
                                <option value="RENT">Rent</option>
                                <option value="MORTGAGE">Mortgage</option>
                                <option value="OWN">Own</option>
                            </select>
                        </div>
                    </div>

                    <div class="section-label">Loan Details</div>

                    <div class="form-group">
                        <label>Loan Amount</label>
                        <div class="input-wrap">
                            <span class="input-icon">$</span>
                            <input type="number" name="loan_amnt" placeholder="e.g. 10000" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Interest Rate (%)</label>
                        <div class="input-wrap">
                            <span class="input-icon">%</span>
                            <input type="number" name="loan_int_rate" placeholder="e.g. 12.5" step="0.01" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Loan % of Income</label>
                        <div class="input-wrap">
                            <span class="input-icon">⚖</span>
                            <input type="number" name="loan_percent_income" placeholder="e.g. 0.17" step="0.01" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Loan Intent</label>
                        <div class="input-wrap select-wrap">
                            <span class="input-icon">🎯</span>
                            <select name="loan_intent">
                                <option value="EDUCATION">Education</option>
                                <option value="MEDICAL">Medical</option>
                                <option value="VENTURE">Venture</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Loan Grade</label>
                        <div class="input-wrap select-wrap">
                            <span class="input-icon">🏅</span>
                            <select name="loan_grade">
                                <option value="A">Grade A</option>
                                <option value="B">Grade B</option>
                                <option value="C">Grade C</option>
                            </select>
                        </div>
                    </div>

                    <div class="section-label">Credit History</div>

                    <div class="form-group">
                        <label>Credit History Length (yrs)</label>
                        <div class="input-wrap">
                            <span class="input-icon">📅</span>
                            <input type="number" name="cb_person_cred_hist_length" placeholder="e.g. 8" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Default on File</label>
                        <div class="input-wrap select-wrap">
                            <span class="input-icon">📋</span>
                            <select name="cb_person_default_on_file">
                                <option value="N">No</option>
                                <option value="Y">Yes</option>
                            </select>
                        </div>
                    </div>

                </div>

                <div class="submit-row">
                    <button type="reset" class="btn-reset">Reset</button>
                    <button type="submit">Assess Credit Risk →</button>
                </div>
            </form>
        </div>

        <p class="footer-note">Results should not replace professional financial judgment.</p>
    </div>

</body>
</html>
